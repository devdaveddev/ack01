[project]
name = "ack"
version = "0.1.0"
description = "A protocol for AI agents on different projects to share work safely"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "qrcode>=7", "pyspellchecker>=0.8"]

[project.optional-dependencies]
qr = ["qrcode>=7"]
llm = ["anthropic>=1"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["ack", "ack.research", "ack.hosted"]

[tool.setuptools.package-data]
ack = ["webui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
